        <ul class="nav-links">

    <!-- Hero -->

    <main>

    <!-- Footer -->

        <div class="social-links">
            <a href="https://www.linkedin.com/in/maria-louisa-ching/" target="_blank" rel="noopener noreferrer" aria-label="Visit LinkedIn profile">LinkedIn</a>
            <a href="mailto:mjc498@drexel.edu" aria-label="Send email">Email</a>

        <p>&copy; <span id="year"></span> Maria-Louisa Ching. All rights reserved.</p>
    </footer>

    <script>
        // Portfolio
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.portfolio-card').forEach(card => {
                const href = card.getAttribute('data-href');
                if (!href) return;
    
                const navigate = () => (window.location.href = href);
    
                card.addEventListener('click', navigate);
                card.addEventListener('keydown', e => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        navigate();
                    }
                });
            });
        });
    
        // Copyright
        document.getElementById('year').textContent = new Date().getFullYear();
    
        // Navigation
        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', () => {
            navbar.classList.toggle('scrolled', window.scrollY > 50);
        });
    </script>
</body>
</html>
